<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), canvas=$('world'), ctx=canvas.getContext('2d',{alpha:false});
const S=96, T=32, KEY='debt_farmer_proto_v1';
const CROPS={
 turnip:{name:'순무',emoji:'🌱',cost:15,value:43,days:2,leaf:'#63a955',fruit:'#eee4d5',stem:'#488643',stage:4},

function makeMap(){
 const tiles=Array.from({length:S},(_,y)=>Array.from({length:S},(_,x)=>{
  const v=hash(x,y);const inBase=x>=31&&x<=66&&y>=33&&y<=64;

 }));
 // A winding compact path connects farmhouse, barn and crop plots.

function load(){try{const saved=localStorage.getItem(KEY);if(!saved)return fresh();const s=JSON.parse(saved);if(!Array.isArray(s.tiles)||s.tiles.length!==S)return fresh();
 const base=fresh();const old=(s.version||1)<2;
 base.gold=Number.isFinite(s.gold)?s.gold:420;base.debt=Number.isFinite(s.debt)?s.debt:6500;base.day=s.day||1;base.tiles=s.tiles;
 base.ownedLand=s.ownedLand||{};base.structures=Array.isArray(s.structures)?s.structures:[];base.totalHarvests=s.totalHarvests||0;base.autoHarvests=s.autoHarvests||s.totalAutomationHarvests||0;
 base.orders=Array.isArray(s.orders)?s.orders:makeOrders(base.day);base.completedOrders=s.completedOrders||0;base.reputation=s.reputation||0;base.managerCrop=CROPS[s.managerCrop]?s.managerCrop:'turnip';base.autoPaused=!!s.autoPaused;
 base.earned=s.earned||0;base.rewarded=s.rewarded||[];base.flags={...base.flags,...s.flags};base.focus=s.focus||base.focus;
 if(!old){base.bags={...base.bags,...s.bags};base.produce={...base.produce,...s.produce};base.toolLv=s.toolLv||1;base.waterLv=s.waterLv||1;base.harvestLv=s.harvestLv||1;base.machInventory={...base.machInventory,...s.machInventory};base.autoDayClock=s.autoDayClock||0;}
 else{ // Previous farming prototype migration: keep money, debt, plots, crops, machines and seeds.
   base.bags={...base.bags,...(s.bag?{turnip:s.bag.turnipSeed||0,potato:s.bag.potatoSeed||0,blueberry:s.bag.blueberrySeed||0}:{})};
   base.produce={...base.produce,...s.produce};base.toolLv=s.toolPower||1;base.waterLv=s.waterPower||1;
   base.machInventory={...base.machInventory,...s.automation};
   for(const row of base.tiles)for(const t of row){if(!t)continue;if(t.crop){const days=CROPS[t.crop.type]?.days||3;const oldDuration={turnip:45,potato:72,blueberry:110}[t.crop.type]||45;t.crop.progress=t.crop.progress??clamp((t.crop.age||0)/oldDuration*days,0,days);t.crop.ready=!!t.crop.ready||t.crop.progress>=days;} }
   base.focus={x:48,y:48,zoom:1.16};
 }
 for(const row of base.tiles)for(const t of row){if(t){if(!('crop' in t))t.crop=null;if(!('structure'in t))t.structure=null;if(!('watered'in t))t.watered=false;if(!('tilled'in t))t.tilled=false;}}
 base.version=3;base.season=seasonOf(base.day);return base;
}catch(e){console.warn('save recovery',e);return fresh();}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(game))}catch(e){console.warn('Autosave unavailable',e)}}
function seasonOf(day){return ['봄','여름','가을','겨울'][Math.floor((day-1)/12)%4];}
function say(message){const a=$('toast');a.textContent=message;a.classList.add('show');toastUntil=performance.now()+2300;}
function chime(freq=600){if(!audioOn)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(freq,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(freq*.67,audioCtx.currentTime+.12);g.gain.setValueAtTime(.035,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.2);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.2)}catch(e){}}
function forRange(x,y,r,fn){for(let yy=y-r;yy<=y+r;yy++)for(let xx=x-r;xx<=x+r;xx++){if(xx>=0&&yy>=0&&xx<S&&yy<S&&Math.max(Math.abs(xx-x),Math.abs(yy-y))<=r)fn(tile(xx,yy),xx,yy)}}
function editable(t){return t&&t.unlocked&&!t.blocked&&t.ground!=='water'&&!t.structure}
function sow(t,key){if(!editable(t)||!t.tilled||t.crop||!game.bags[key])return false;t.crop={type:key,progress:0,ready:false};game.bags[key]--;return true}
function harvest(t,automatic=false){if(!t?.crop||!t.crop.ready)return false;let key=t.crop.type,def=CROPS[key];if(!def)return false;game.produce[key]=(game.produce[key]||0)+1;game.totalHarvests++;if(automatic)game.autoHarvests++;
 if(Math.random()<.035){game.gold+=Math.round(def.value*1.5);say('황금 품질 보너스! +'+money(def.value*1.5));}
 if(def.regrow){t.crop.progress=def.days-def.regrow;t.crop.ready=false;}else t.crop=null;
 for(const m of MILESTONES)if(game.totalHarvests>=m.at&&!game.rewarded.includes(m.at)){game.rewarded.push(m.at);game.gold+=m.reward;say(`달성! ${m.text} · 보너스 ${money(m.reward)}`)}
 return true;
}
function perform(x,y,quiet=false){const t=tile(x,y);if(!t||!t.unlocked){if(!quiet)say('아직 소유하지 않은 땅이야. 상점에서 농지를 확장해 봐.');return false}
 if(Object.hasOwn(MACHINES,tool)){
  if(!editable(t)||t.crop||t.tilled){if(!quiet)say('기계는 비어 있는 평지에 설치해 줘.');return false}
  if(!game.machInventory[tool]){if(!quiet)say('설치할 기계를 먼저 상점에서 구매해 줘.');return false}
  game.machInventory[tool]--;t.structure=tool;game.structures.push({x,y,type:tool});tool='hoe';drawTools();say('설치 완료! 다음 날부터 자동으로 작동해.');chime(850);return true;
 }
 let applied=0;
 const r=tool==='hoe'?game.toolLv-1:tool==='water'?game.waterLv-1:tool==='harvest'?game.harvestLv-1:0;
 forRange(x,y,r,(tt)=>{
   if(tool==='hoe'){if(editable(tt)&&!tt.tilled&&!tt.crop){tt.tilled=true;tt.deco=null;applied++}}
   else if(tool==='water'){if(tt&&tt.unlocked&&(tt.tilled||tt.crop)){tt.watered=true;applied++}}
   else if(tool==='harvest'){if(harvest(tt))applied++}
   else if(tool==='clear'){if(tt&&tt.unlocked&&tt.deco&&tt.ground!=='water'&&!tt.structure){tt.deco=null;tt.blocked=false;game.gold+=3;applied++}}
   else if(Object.hasOwn(CROPS,tool)){if(sow(tt,tool))applied++}
 });
 if(applied){chime(tool==='harvest'?730:410);if(tool==='harvest'){floatText(x,y,`+${applied} 수확`);if(applied>1)say(`${applied}개 한꺼번에 수확!`);}return true}
 if(!quiet){if(Object.hasOwn(CROPS,tool)&&!game.bags[tool])say(`${CROPS[tool].name} 씨앗이 없어. 상점에서 구입해 줘.`);else if(tool==='harvest')say('아직 다 자란 작물이 없어.');else say('해당 위치에는 작업할 수 없어.');}
 return false;
}
// Stable per-day town deliveries: optional bonuses, never a fail state.
function makeOrders(day,reputation=0){
 const available=day<5?['turnip']:day<10?['turnip','potato']:day<18?['turnip','potato','strawberry','tomato']:Object.keys(CROPS);
 return [0,1].map(i=>{const key=available[Math.floor(hash(day,i,25)*available.length)];const count=3+Math.floor(hash(i,day,17)*4)+(day>12?2:0);return {id:`${day}-${i}`,type:key,count,reward:Math.round(CROPS[key].value*count*(1.45+hash(day,i,31)*.3)*(1+Math.floor(reputation/5)*.08)),done:false};});
}
function fulfillOrder(index){const order=game.orders[index];if(!order||order.done)return;const n=game.produce[order.type]||0;
 if(n<order.count){say(`수확 창고에 ${CROPS[order.type].name} ${order.count-n}개가 더 필요해.`);return;}
 game.produce[order.type]-=order.count;game.gold+=order.reward;game.earned+=order.reward;game.reputation++;game.completedOrders++;order.done=true;
 floatText(49,49,`주문 +${money(order.reward)}`);say(`납품 성공! +${money(order.reward)} · 마을 평판 +1`);chime(890);save();showOrders();refreshUI();
}
function showOrders(){const rows=game.orders.map((o,i)=>{const c=CROPS[o.type],n=game.produce[o.type]||0;
 return `<article class="orderCard"><div class="orderIcon">${c.emoji}</div><div class="orderCopy"><strong>${c.name} ${o.count}개 납품</strong><small>창고 ${n}/${o.count}개 · 일반 판매보다 높은 보상</small></div><div><b>${money(o.reward)}</b><button data-order="${i}" ${o.done||n<o.count?'disabled':''}>${o.done?'완료':'납품하기'}</button></div></article>`}).join('');
 modal('마을 주문 게시판',`${game.day}일차 · 매일 새 주문 · 마을 평판 ${game.reputation}`,`<p class="note">서두를 필요 없어요. 주문은 매일 새로 들어오고, 미완료 주문에 벌금은 없습니다. 마을 평판 5마다 다음 주문 보상이 8%씩 증가합니다.</p><div class="orderList">${rows}</div><p class="note">수확물은 먼저 창고에 쌓여요. 주문 납품, 일반 판매 또는 가공으로 활용할 수 있습니다.</p>`);

function processPreserves(){if(!game.flags.preserves)return 0;let revenue=0,processed=0;
 // Keep enough produce for active orders before processing surplus.
 for(const [key,d] of Object.entries(CROPS)){const reserved=game.orders.filter(o=>!o.done&&o.type===key).reduce((n,o)=>n+o.count,0);const surplus=Math.max(0,(game.produce[key]||0)-reserved);
 const qty=Math.min(surplus,8-processed);if(qty<=0)continue;
 game.produce[key]-=qty;processed+=qty;revenue+=Math.floor(qty*d.value*1.8);if(processed>=8)break;
 }
 if(revenue){game.gold+=revenue;game.earned+=revenue;floatText(49,49,`가공 +${money(revenue)}`);}return revenue;
}
function floatText(x,y,message){effects.push({x,y,text:message,created:performance.now()});if(effects.length>36)effects.shift()}
function maintainField(m){let jobs=0,planted=0;
 // A late-game field controller handles planting, irrigation, and harvesting within 9x9.
 forRange(m.x,m.y,MACHINES.manager.range,(t,x,y)=>{if(!t||!t.unlocked||t.ground==='water'||t.blocked||t.structure)return;
 if(t.crop){t.watered=true;return;}if(jobs>=16)return;
 if(!t.tilled){t.tilled=true;t.deco=null;}
 const seed=game.managerCrop,d=CROPS[seed];
 if(!game.bags[seed]){if(game.gold<d.cost+30)return;game.gold-=d.cost;game.bags[seed]++;}
 if(sow(t,seed)){jobs++;planted++;}
 });return planted;
}
function waterAround(t,x,y){forRange(x,y,3,(a)=>{if(a&&a.unlocked&&(a.tilled||a.crop))a.watered=true})}
function runAutomations(){
 if(game.weather==='rain')for(const row of game.tiles)for(const t of row)if(t?.crop||t?.tilled)t.watered=true;
 for(const m of game.structures)if(m.type==='sprinkler')waterAround(tile(m.x,m.y),m.x,m.y);
 for(const m of game.structures)if(m.type==='manager')forRange(m.x,m.y,4,t=>{if(t&&(t.tilled||t.crop))t.watered=true;});
 // Growth comes before harvest, then replant. Only adjacent automation zones are affected.
 for(const row of game.tiles)for(const t of row)if(t?.crop){const c=t.crop;const d=CROPS[c.type];if(!d)continue;if(!c.ready){c.progress+=t.watered?1.48:.75;if(c.progress>=d.days)c.ready=true;}}
 for(const m of game.structures)if(m.type==='harvester'||m.type==='manager')forRange(m.x,m.y,m.type==='manager'?4:3,t=>harvest(t,true));
 if(game.flags.seedSupply&&game.bags.turnip<12&&game.gold>=210){game.bags.turnip+=14;game.gold-=210;}
 for(const m of game.structures)if(m.type==='seeder')forRange(m.x,m.y,3,t=>sow(t,'turnip'));
 for(const m of game.structures)if(m.type==='manager')maintainField(m);
 processPreserves();
 if(game.flags.delivery)sellAll(true);
 for(const row of game.tiles)for(const t of row)if(t)t.watered=false;
}
function newDay(){game.day++;game.orders=makeOrders(game.day,game.reputation);game.season=seasonOf(game.day);const r=Math.random();game.weather=game.season==='겨울'?(r<.25?'snow':r<.5?'rain':'sun'):(r<.18?'rain':r<.28?'cloud':'sun');runAutomations();

 else say(`${game.season} ${game.day}일차 · ${weatherText()} · 농장이 하루 자랐어.`);

function weatherText(){return({sun:'맑음',rain:'비',cloud:'흐림',snow:'눈'})[game.weather]||'맑음'}
function sellAll(auto=false){let n=0,total=0;for(const key of Object.keys(CROPS)){const count=game.produce[key]||0;total+=count*CROPS[key].value;n+=count;game.produce[key]=0}game.gold+=total;game.earned+=total;
 if(!auto)say(n?`수확물 ${n}개 배송! +${money(total)}`:'창고에 판매할 작물이 없어.');if(n)chime(830);return total}
function repay(amount){if(game.debt<=0){say('이미 모든 빚을 갚았어!');return}amount=Math.min(amount,game.gold,game.debt);if(amount<=0){say('상환할 돈이 부족해.');return}game.gold-=amount;game.debt-=amount;save();showDebt();if(game.debt===0){say('축하해! 빚을 모두 갚았어!');chime(1100);}else say(`${money(amount)} 상환 완료!`);refreshUI();}

 $('machineSummary').innerHTML=Object.entries(MACHINES).map(([k,m])=>row(m.emoji+' '+m.name,game.structures.filter(x=>x.type===k).length+'대')).join('')+row('자동 출하',game.flags.delivery?'작동 중':'미구매')+row('자동 날짜',game.flags.calendar?(game.autoPaused?'일시정지':'작동 중'):'미구매')+row('가공 공방',game.flags.preserves?'작동 중':'미구매');
 $('orderSummary').innerHTML=game.orders.map(o=>`<div class="orderMini ${o.done?'done':''}"><span>${CROPS[o.type].emoji} ${CROPS[o.type].name} ${Math.min(game.produce[o.type]||0,o.count)}/${o.count}</span><b>${o.done?'완료':money(o.reward)}</b></div>`).join('');
 $('autoDayToggle').textContent=game.flags.calendar?(game.autoPaused?'자동 날짜 ▶ 재개':'자동 날짜 Ⅱ 정지'):'자동 날짜 잠김';$('autoDayToggle').disabled=!game.flags.calendar;
 const debtRate=clamp((6500-game.debt)/6500*100,0,100);$('progressInfo').innerHTML=game.debt?'농사를 지어 빚을 갚고, 큰 농장을 차근차근 개척해 보세요.':'대출 완납! 이제 커다란 자동화 농장으로 성장해 보세요.';
 $('goalBars').innerHTML=`<div class="kv"><span>대출 상환</span><strong>${debtRate.toFixed(0)}%</strong></div><div class="goalBar"><div style="width:${debtRate}%"></div></div>`+row('누적 수확',game.totalHarvests+'개')+row('마을 평판',game.reputation+'점')+row('총 판매',money(game.earned));
}
function resize(){const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.floor(innerWidth*dpr);canvas.height=Math.floor(innerHeight*dpr);canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(dpr,0,0,dpr,0,0);ctx.imageSmoothingEnabled=false;}
function getScreen(x,y){const z=T*game.focus.zoom;return{x:(x-game.focus.x)*z+innerWidth/2,y:(y-game.focus.y)*z+innerHeight/2};}
function worldAt(x,y){const z=T*game.focus.zoom;return {x:(x-innerWidth/2)/z+game.focus.x,y:(y-innerHeight/2)/z+game.focus.y}}
function moveCamera(dx,dy){const z=T*game.focus.zoom;game.focus.x=clamp(game.focus.x-dx/z,0,S);game.focus.y=clamp(game.focus.y-dy/z,0,S)}
function zoomAt(factor,x=innerWidth/2,y=innerHeight/2){const before=worldAt(x,y);game.focus.zoom=clamp(game.focus.zoom*factor,.6,2.35);const after=worldAt(x,y);game.focus.x=clamp(game.focus.x+before.x-after.x,0,S);game.focus.y=clamp(game.focus.y+before.y-after.y,0,S)}
function hookInput(){
 window.addEventListener('resize',resize);
 window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(!$('modal').classList.contains('hidden'))return;
  if(e.key.toLowerCase()==='q')showShop();if(e.key.toLowerCase()==='e')newDay();
  if(e.key>='1'&&e.key<='9'){const b=$('toolstrip').children[Number(e.key)-1];if(b){tool=b.dataset.tool;drawTools()}}
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();const dir={ArrowLeft:[120,0],ArrowRight:[-120,0],ArrowUp:[0,120],ArrowDown:[0,-120]}[e.key];moveCamera(...dir)}});
 const touches={};let zoomBaseline=0;
 canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointer.set(e.pointerId,{x:e.clientX,y:e.clientY,originalX:e.clientX,originalY:e.clientY,button:e.button,shift:e.shiftKey,moved:false,lastPaint:''});if(pointer.size===2){const p=[...pointer.values()];zoomBaseline=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)}}, {passive:true});
 canvas.addEventListener('pointermove',e=>{const w=worldAt(e.clientX,e.clientY);hover={x:Math.floor(w.x),y:Math.floor(w.y)};const p=pointer.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(Math.hypot(p.x-p.originalX,p.y-p.originalY)>6)p.moved=true;
  if(pointer.size===2){const a=[...pointer.values()],distance=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(zoomBaseline>20){zoomAt(distance/zoomBaseline,(a[0].x+a[1].x)/2,(a[0].y+a[1].y)/2)}zoomBaseline=distance;return}
  if(p.shift){const key=`${hover.x},${hover.y}`;if(p.lastPaint!==key){perform(hover.x,hover.y,true);p.lastPaint=key;}return}
  if(p.moved)moveCamera(dx,dy);
 });
 canvas.addEventListener('pointerup',e=>{const p=pointer.get(e.pointerId);if(!p)return;if(pointer.size===1&&!p.moved){const w=worldAt(e.clientX,e.clientY);perform(Math.floor(w.x),Math.floor(w.y))}pointer.delete(e.pointerId);zoomBaseline=0;});
 canvas.addEventListener('pointercancel',e=>pointer.delete(e.pointerId));
 canvas.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.13:.885,e.clientX,e.clientY)},{passive:false});
 canvas.addEventListener('contextmenu',e=>e.preventDefault());
 $('zoomIn').onclick=()=>zoomAt(1.2);$('zoomOut').onclick=()=>zoomAt(.84);$('homeCam').onclick=()=>{game.focus.x=41;game.focus.y=43;game.focus.zoom=1.12};
 $('shopBtn').onclick=showShop;$('debtBtn').onclick=showDebt;$('nextDayBtn').onclick=newDay;$('orderBtn').onclick=showOrders;$('sellBtn').onclick=()=>{sellAll();refreshUI();save()};
 $('autoDayToggle').onclick=()=>{if(!game.flags.calendar)return;game.autoPaused=!game.autoPaused;save();refreshUI();};$('orderSidebar').onclick=showOrders;
 $('audioToggle').onclick=()=>{audioOn=!audioOn;$('audioToggle').textContent=audioOn?'♫':'♪';if(audioOn)chime(770)};
 $('closeModal').onclick=closeModal;$('modal').querySelector('[data-close]').onclick=closeModal;
 $('sideToggle').onclick=()=>{$('sideInfo').classList.toggle('minimized');$('sideToggle').textContent=$('sideInfo').classList.contains('minimized')?'⌄':'⌃'};
}
function closeModal(){$('modal').classList.add('hidden')}
// Draw our own original crisp-edged pixel-art tiles and sprites; no external assets or APIs.
const seasonPal={봄:['#91bf6f','#83b56c'],여름:['#7fba64','#78ae5e'],가을:['#b9b978','#b1ad6a'],겨울:['#c3d1c3','#b5c9b8']};
function px(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function treeSprite(x,y,season){px(x+13,y+20,7,12,'#75553a');px(x+9,y+20,15,5,'#614632');const a=season==='가을'?['#ca9956','#af7544','#e5b86b']:season==='겨울'?['#728b77','#9fb4a0','#d6ddd0']:['#457c49','#6b9f57','#89b86a'];px(x+7,y+9,21,13,a[0]);px(x+11,y+3,16,11,a[1]);px(x+3,y+14,12,12,a[1]);px(x+21,y+12,10,11,a[0]);px(x+13,y+5,5,5,a[2]);px(x+22,y+17,4,4,a[2]);px(x+6,y+20,6,4,a[0])}
function drawCrop(t,x,y){const c=t.crop;if(!c)return;const d=CROPS[c.type];if(!d)return;const ratio=clamp(c.progress/d.days,0,1),stage=c.ready?4:Math.min(3,Math.floor(ratio*4));px(x+15,y+21,3,7,d.stem);if(stage===0){px(x+13,y+21,4,4,d.leaf);px(x+17,y+19,5,4,d.leaf);return}
 px(x+8,y+17,8,6,d.leaf);px(x+16,y+12,7,9,d.leaf);px(x+20,y+18,7,6,d.leaf);if(stage>=2){px(x+10,y+11,7,7,d.leaf);px(x+21,y+10,5,7,d.leaf)}
 if(stage>=3){px(x+11,y+15,10,11,d.fruit);if(c.type==='turnip'){px(x+13,y+21,8,5,'#dfc9c5')}if(c.type==='strawberry')px(x+13,y+17,3,3,'#ffcd98');if(c.type==='pumpkin'){px(x+8,y+12,19,14,d.fruit);px(x+15,y+9,5,4,'#4a7839')}}
 if(c.ready){px(x+12,y+2,3,3,'#fff0ae');px(x+17,y+1,4,4,'#fdfbdf');px(x+19,y+7,3,3,'#ffe5a1')}
}
function structureSprite(type,x,y){const a=type==='sprinkler';if(type==='manager'){px(x+2,y+13,29,17,'#81573c');px(x+5,y+3,23,14,'#cd9560');px(x+8,y+0,16,6,'#8b6b7c');px(x+12,y+17,10,12,'#ded1a5');px(x+13,y+7,6,5,'#b6decd');px(x+1,y+26,31,4,'#d9bf82')}else if(a){px(x+13,y+8,6,18,'#667b83');px(x+7,y+8,19,5,'#b9e3e9');px(x+15,y+5,3,5,'#e4f9ff');px(x+5,y+19,5,3,'#83d8f6');px(x+25,y+17,4,4,'#88d9ef')}else if(type==='seeder'){px(x+7,y+10,19,16,'#a86a38');px(x+9,y+5,15,9,'#d9b96c');px(x+11,y+12,10,7,'#724d2f');px(x+5,y+24,6,5,'#665d57');px(x+22,y+24,6,5,'#665d57')}else{px(x+6,y+10,21,13,'#c7d2d5');px(x+9,y+5,14,10,'#8097a9');px(x+12,y+8,8,4,'#c1eafa');px(x+4,y+21,8,7,'#575655');px(x+22,y+21,8,7,'#575655');px(x+25,y+14,6,3,'#e4ad56')}}
function drawHouse(x,y){ctx.save();ctx.translate(Math.round(x),Math.round(y));ctx.shadowColor='rgba(24,41,23,.2)';ctx.shadowBlur=4;px(1,26,32*7-2,32*6-24,'#b6a476');ctx.shadowBlur=0;px(7,51,200,104,'#e4c08d');px(15,61,184,83,'#eacb9e');px(0,50,224,19,'#6b744b');px(11,26,202,29,'#b8664f');px(20,8,184,28,'#bf7252');px(35,0,148,15,'#d68b5a');for(let i=0;i<11;i++){px(13+i*18,31+(i%2)*2,10,3,'#e3a17b')}px(85,96,43,59,'#805e4b');px(92,105,29,49,'#aa8155');px(143,86,41,38,'#8cb2b3');px(147,90,33,30,'#c6e6dc');px(14,86,42,38,'#8cb2b3');px(18,90,34,30,'#c7e7dc');px(34,88,4,36,'#7d745f');px(160,88,4,36,'#7d745f');px(99,126,5,5,'#f6d69a');ctx.restore()}
function drawBarn(x,y){ctx.save();ctx.translate(Math.round(x),Math.round(y));px(0,55,8*32,6*32-55,'#a75d42');px(13,69,230,105,'#c57a54');px(11,45,236,24,'#e9c092');px(40,0,168,52,'#9d624c');px(11,25,226,31,'#ba764e');px(75,92,85,82,'#77563e');px(89,105,56,69,'#e0c498');px(111,105,6,69,'#926945');px(185,90,33,36,'#a7ced2');px(194,90,4,36,'#7e8f84');px(29,91,34,37,'#a7ced2');ctx.restore()}
function tileSprite(t,wx,wy,x,y,z){ctx.save();ctx.translate(Math.round(x),Math.round(y));ctx.scale(z/32,z/32);
 if(t.ground==='water'){px(0,0,32,32,'#65afb8');px(0,0,32,3,'#81bec1');if(hash(wx,wy,13)<.8)px(6,12,13,2,'#9dd5cc');px(18,25,8,2,'#a2d9cc');ctx.restore();return}
 const pal=seasonPal[game.season]||seasonPal.봄;px(0,0,32,32,pal[(wx+wy)%2]);const h=hash(wx,wy);
 if(h<.8){px(5+Math.floor(h*17),8+Math.floor(h*7),2,3,game.season==='겨울'?'#dfe9d7':'#6eae60');px(18,24,4,2,game.season==='겨울'?'#e5f0e7':'#95c17a')}
 if(t.ground==='path'){px(0,0,32,32,'#d4be91');px(3,9,8,3,'#decaa2');px(18,24,10,3,'#c3a77b')}
 if(t.tilled){px(2,2,28,28,t.watered?'#6f6150':'#866448');px(4,5,24,2,t.watered?'#7d6d57':'#a48158');px(4,15,24,2,'#4e483c');px(4,25,24,2,'#5f493a');px(9,7,2,5,'#aa865c');px(22,19,3,4,'#aa865c');}
 if(t.deco==='flower'){px(12,18,3,9,'#4c8f4b');px(9,12,10,9,game.season==='겨울'?'#fff0e3':'#efc1bc');px(12,15,4,4,'#f7e5ab')}
 else if(t.deco==='bush'){px(5,17,22,12,'#467d43');px(9,13,17,12,'#619c4c');px(14,17,4,3,'#b2cc76')}
 else if(t.deco==='grass'){px(8,19,2,10,'#3e8e4e');px(13,17,3,12,'#5da759');px(20,20,2,7,'#4c8e4b')}
 else if(t.deco==='stone'){px(4,19,23,12,'#83968c');px(9,15,14,7,'#b0beb4');px(5,22,23,5,'#6f8582')}
 else if(t.deco==='tree')treeSprite(0,0,game.season);
 if(t.crop)drawCrop(t,0,0);
 if(t.structure)structureSprite(t.structure,0,0);
 if(!t.unlocked){px(0,0,32,32,'rgba(27,49,36,.44)');if(wx%3===0&&wy%3===0)px(13,14,5,5,'#829579')}
 ctx.restore();}
function render(){const w=innerWidth,h=innerHeight,z=T*game.focus.zoom;ctx.fillStyle=(seasonPal[game.season]||seasonPal.봄)[0];ctx.fillRect(0,0,w,h);
 let x0=Math.max(0,Math.floor(game.focus.x-w/(2*z))-1),y0=Math.max(0,Math.floor(game.focus.y-h/(2*z))-1),x1=Math.min(S,Math.ceil(game.focus.x+w/(2*z))+1),y1=Math.min(S,Math.ceil(game.focus.y+h/(2*z))+1);
 for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){const a=getScreen(x,y);tileSprite(tile(x,y),x,y,a.x,a.y,z)}
 // Buildings are part of the farm itself. There is intentionally no player character.
 const houses=[{x:44,y:44,draw:drawHouse},{x:56,y:45,draw:drawBarn}];
 for(const obj of houses){const a=getScreen(obj.x,obj.y);if(a.x>-400&&a.x<w+100&&a.y>-300&&a.y<h+150){ctx.save();ctx.translate(Math.round(a.x),Math.round(a.y));ctx.scale(z/32,z/32);obj.draw(0,0);ctx.restore()}}
 // boundary posts around the starting area
 for(let x=31;x<=67;x++){for(const y of [33,65]){const a=getScreen(x,y);if(a.x>=-50&&a.x<w+50&&a.y>=-50&&a.y<h+50){ctx.fillStyle='#d9bf8b';ctx.fillRect(a.x,a.y,Math.max(2,z*.1),Math.max(4,z*.35))}}}
 // Show automation coverage before placement, so large farms are easier to plan.
 if(hover&&Object.hasOwn(MACHINES,tool)&&game.machInventory[tool]>0){const range=MACHINES[tool].range;const z=T*game.focus.zoom;const corner=getScreen(hover.x-range,hover.y-range);ctx.fillStyle='rgba(243,228,139,.105)';ctx.fillRect(corner.x,corner.y,(range*2+1)*z,(range*2+1)*z);ctx.strokeStyle='rgba(249,228,141,.8)';ctx.setLineDash([8,5]);ctx.lineWidth=2;ctx.strokeRect(corner.x,corner.y,(range*2+1)*z,(range*2+1)*z);ctx.setLineDash([]);}
 // Floating harvest numbers add immediate feedback without hiding crops.
 effects=effects.filter(f=>performance.now()-f.created<1450);for(const e of effects){const age=(performance.now()-e.created)/1450;const a=getScreen(e.x,e.y);ctx.save();ctx.globalAlpha=1-age;ctx.textAlign='center';ctx.font='bold 14px system-ui';ctx.strokeStyle='#3e5530';ctx.lineWidth=3;ctx.strokeText(e.text,a.x,a.y-age*45);ctx.fillStyle='#fff0ab';ctx.fillText(e.text,a.x,a.y-age*45);ctx.restore();}
 if(hover&&hover.x>=0&&hover.y>=0&&hover.x<S&&hover.y<S){const a=getScreen(hover.x,hover.y);const t=tile(hover.x,hover.y);ctx.strokeStyle=t?.unlocked?'rgba(255,255,226,.98)':'rgba(249,162,131,.95)';ctx.lineWidth=2;ctx.strokeRect(Math.round(a.x)+1,Math.round(a.y)+1,z-2,z-2)}
 if(game.weather==='rain'){ctx.fillStyle='rgba(59,90,108,.06)';ctx.fillRect(0,0,w,h);for(let i=0;i<80;i++){const xx=(hash(i,game.day,1)*w+(performance.now()*.11*(i%3+1)))%w,yy=(hash(i,game.day,2)*h+performance.now()*.26*(1+i%3))%h;ctx.fillStyle='rgba(218,236,245,.37)';ctx.fillRect(xx,yy,1,8)}}
 if(game.season==='겨울'){ctx.fillStyle='rgba(230,246,238,.12)';ctx.fillRect(0,0,w,h)}
}
function animate(ts){if(!last)last=ts;const dt=Math.min(.05,(ts-last)/1000);last=ts;timeAcc+=dt;uiAcc+=dt;saveAcc+=dt;
 if(game.flags.calendar&&!game.autoPaused&&$('modal').classList.contains('hidden')){game.autoDayClock+=dt;if(game.autoDayClock>=31)newDay()}
 if(uiAcc>.24){refreshUI();uiAcc=0}if(saveAcc>8){save();saveAcc=0}
 if(toastUntil&&ts>toastUntil){$('toast').classList.remove('show');toastUntil=0}
 if(ts-lastPaint>35){render();lastPaint=ts}requestAnimationFrame(animate)}
