<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07121f">
<meta name="description" content="심해에서 보물을 인양하고 계약을 완수하며 크레인을 강화하는 무료 브라우저 로그라이트 게임">
<title>DEEP SALVAGE — 심해 인양 계약</title>
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="brandicon">◈</span><div><b>DEEP <em>SALVAGE</em></b><small>심해 인양 계약 <span class="beta">v1.0</span></small></div></div>
    <div class="metrics">
      <div class="metric"><span>계약</span><b id="dayStat">01 / 05</b></div>
      <div class="metric"><span>남은 시간</span><b id="timerStat">1:20</b></div>
      <div class="metric gold"><span>보유 크레딧</span><b id="walletStat">0</b></div>
    </div>
    <div class="top-actions"><button id="audioBtn" class="icon-btn" aria-label="사운드 켜기/끄기" title="사운드 켜기/끄기">♪</button><button id="pauseBtn" class="icon-btn" aria-label="일시정지" title="일시정지 / P">Ⅱ</button></div>
  </header>
  <main id="arena" class="arena">
    <canvas id="gameCanvas" aria-label="심해 인양 플레이 화면"></canvas>
    <div class="top-overlay">
      <div class="contract-card">
        <div class="contract-heading"><div><span class="eyebrow">TODAY'S CONTRACT</span><strong id="contractName">침몰한 잔해</strong></div><div class="target" id="targetStat">0 / 320</div></div>
        <div class="progress"><span id="quotaProgress"></span></div>
        <div class="info-row"><span id="contractHint">획득한 화물을 선상으로 끌어올리세요</span><span id="depthStat">깊이 0m</span></div>
      </div>
      <div class="cargo-card"><div class="cargo-top"><span>인양 화물</span><b id="cargoStat">0 / 6.0t</b></div><div class="progress cargo-progress"><span id="cargoProgress"></span></div><div class="cargo-bottom" id="cargoValue">예상 수익 +0</div></div>
    </div>
    <div id="toast" class="toast" aria-live="polite"></div>
    <div id="haulMessage" class="haul-message" aria-hidden="true"></div>
    <div class="depth-label"><span class="depth-line"></span><span id="zoneLabel">연안 수역</span></div>
    <div class="control-hint"><span class="mouse-icon">↧</span><span id="controlHint">원하는 위치를 누르고 있으면 하강 · 놓으면 인양</span></div>
    <div class="legend"><span class="legend-gold">◆</span> 보물 &nbsp; <span class="legend-red">✖</span> 위험물</div>
    <div id="modal" class="modal" aria-live="polite"><div id="modalContent" class="modal-inner"></div></div>
  </main>
  <footer class="upgradebar">
    <div class="bar-heading"><span>LIVE UPGRADES</span><small>인양 수익으로 즉시 강화</small></div>
    <button class="upgrade-btn" data-upgrade="speed"><span class="upgrade-ic">⚙</span><span class="upgrade-body"><b>모터 강화 <i id="speedLv">Lv.0</i></b><small>하강·인양 속도</small></span><strong id="speedCost">85</strong></button>
    <button class="upgrade-btn" data-upgrade="capacity"><span class="upgrade-ic">▣</span><span class="upgrade-body"><b>화물 용량 <i id="capacityLv">Lv.0</i></b><small>더 많은 보물 수집</small></span><strong id="capacityCost">115</strong></button>
    <button class="upgrade-btn" data-upgrade="luck"><span class="upgrade-ic">✦</span><span class="upgrade-body"><b>탐지 장치 <i id="luckLv">Lv.0</i></b><small>고가 보물 발견</small></span><strong id="luckCost">140</strong></button>
  </footer>
</div>
<script src="game.js?v=1"></script>
</body>
</html>
